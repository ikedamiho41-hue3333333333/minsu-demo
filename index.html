	}
	function platform() {
		return `<div class="page-pad"><h1 class="page-title">支持商家，把服务做好。</h1><p class="page-description">管理入口留在后台，客人从民宿首页直接开始。</p><button class="btn secondary wide" data-action="nav" data-route="platform/activities">${icon("pin")} 大理本地活动管理</button><p class="version-line" style="margin-top:12px">本地生活AI：演示模式 · 真实国内AI接口待接入</p><div class="platform-intro"><h2>${esc(state.published.name)}</h2><p>虚构商家 · 示例房源 songjian-demo<br>展示状态：${state.visible ? "对客人展示中" : "已暂停展示"}<br>当前公开资料：V${state.published.version}</p></div><div class="support-summary"><div><strong>${Object.keys(state.threads).length}</strong><span>演示咨询会话</span></div><div><strong>${pending().length}</strong><span>待人工处理</span></div></div><div class="panel-line"><div><strong>房源展示</strong><p>${state.visible ? "客人可看房和提问。" : "客人保留历史，不能发起新咨询。"}</p></div>${btn(state.visible ? "暂停展示" : "恢复展示", "visibility", "secondary compact")}</div><div class="panel-line"><div><strong>公开问答</strong><p>${state.published.knowledge.length}条生效 · 草稿${state.draft.knowledge.length}条</p></div><span class="tag">V${state.published.version}</span></div><div class="panel-line"><div><strong>资料草稿</strong><p>${state.draftDirty ? "有保存尚未发布的修改" : "与当前公开资料一致"}</p></div><button class="text-btn" data-action="nav" data-route="merchant/editor">查看 ${icon("chevron")}</button></div><div class="panel-line"><div><strong>人工服务</strong><p>真实演示操作生成，没有伪造待办。</p></div><button class="text-btn" data-action="nav" data-route="merchant/queue">咨询列表 ${icon("chevron")}</button></div><p class="notice">平台只提供本地演示管理。本次没有接入真实身份、审核团队、模型服务或外部通知。</p>${btn(icon("external") + " 导出演示数据备份", "export", "outline wide")}<button class="text-btn" data-action="reset">${icon("refresh")} 恢复初始示例</button></div>`;
	}
	document.addEventListener("click", (e) => {
		const b = e.target.closest("[data-action]");
		if (!b || b.disabled) return;
		const a = b.dataset.action;
		if (handleExtraAction(a, b)) return;
		if (a === "close-dialog") {
			closeDialog();
			return;
		}
		if (a === "dialog-confirm") {
			const f = dialogAction;
			closeDialog();
			f?.();
			return;
		}
		if (a === "nav") {
			mobileOpen = false;
			go(b.dataset.route);
			return;
		}
		if (a === "role") {
			mobileOpen = false;
			if ($("#detail-dialog").open) closeDialog();
			go(b.dataset.role + "/home");
			return;
		}
		if (a === "guest-home") {
			mobileOpen = false;
			go("guest/home");
			return;
		}
		if (a === "switch-chat") {
			mobileOpen = false;
			go("guest/chat");
			return;
		}
		if (a === "switch-merchant") {
			mobileOpen = false;
			go("merchant/home");
			return;
		}
		if (a === "mobile-controls") {
			mobileOpen = !mobileOpen;
			render();
			return;
		}
		if (a === "about") {
			const controls = mobilePresentation() && !customerPreview ? `<p class="demo-menu-label">切换演示视角</p><nav class="demo-role-menu" aria-label="切换演示视角">${[
				[
					"guest",
					"客人端",
					"看房与咨询"
				],
				[
					"merchant",
					"商家端",
					"接待与分享"
				],
				[
					"platform",
					"平台端",
					"资料与活动"
				]
			].map(([key, label, hint]) => `<button data-action="role" data-role="${key}" class="${role() === key ? "active" : ""}" aria-pressed="${role() === key}"><strong>${label}</strong><small>${hint}</small></button>`).join("")}</nav>${demoSelectors()}` : "";
			showDialog(controls ? "演示入口" : "关于这个演示", `${controls}<p class="dialog-copy">房源与本地生活为示例内容，VR为第三方参考案例。AI按已公开资料做本地问答演示，尚未连接真实模型。\n\n资料和咨询保存在当前浏览器，各设备独立；尚未接入真实登录与通知。</p>`);
			return;
		}
		if (a === "try-kitchen") {
			goChat("厨房能做饭吗");
			return;
		}
		if (a === "try-room") {
			goChat("这间房床有多大", { roomId: guestProperty().rooms[0]?.id });
			return;
		}
		if (a === "try-pets") {
			goChat("可以带宠物吗");
			return;
		}
		if (a === "prefill") {
			composer.body = b.dataset.question;
			saveComposer();
			render();
			$("#chat-input")?.focus();
			return;
		}
		if (a === "ask-room") {
			goChat("这间房的床型和设施是什么？", { roomId: b.dataset.room });
			return;
		}
		if (a === "ask-detail") {
			if (page() === "room") goChat("这间房的床型和设施是什么？", { roomId: parts()[2] });
			else {
				const s = spaceInfo();
				goChat(s.key === "kitchen" ? "厨房能做饭吗" : "这里的开放时间是什么？", { spaceName: s.name });
			}
			return;
		}
		if (a === "clear-context") {
			composer.context = null;
			saveComposer();
			render();
			return;
		}
		if (a === "room-filter") {
			roomFilter = b.dataset.filter;
			render();
			return;
		}
		if (a === "queue-filter") {
			queueFilter = b.dataset.filter;
			render();
			return;
		}
		if (a === "fact") {
			const key = b.dataset.key, t = TOPICS[key], text = state.published.facts[key]?.text;
			showDialog(t.label, `<p class="dialog-copy">${esc(text || "本店尚未记录这一规则，请管家确认。")}</p><p class="version-line" style="margin-top:17px">来源：${esc(state.published.name)}公开资料 V${state.published.version}</p>${btn("带着这个问题问管家", "dialog-confirm", "secondary wide")}`, () => goChat({
				kitchen: "厨房能做饭吗",
				parking: "怎么停车",
				checkin: "几点可以入住",
				environment: "公共区域几点开放"
			}[key] || "想了解" + t.label));
			return;
		}
		if (a === "photo") {
			showDialog(b.dataset.label, `<div class="photo-dialog">${photo(b.dataset.scene)}<p class="small muted">AI生成的空间氛围示意，不是房源实拍。</p></div>`);
			return;
		}
		if (a === "sources") {
			const m = state.threads[b.dataset.thread]?.messages.find((m) => m.id === b.dataset.message);
			if (!m) return;
			showDialog("这条答复的资料依据", `<p class="small muted">${m.sources[0]?.version !== state.published.version ? "资料已有新版本，以下保留当时回答所使用的依据。" : "只引用本民宿已公开资料。"}</p>${m.sources.map((s) => `<section class="source-detail"><h3>${esc(s.label)}</h3><p>${esc(s.text)}</p><small>${s.kind === "confirmation_guide" ? `${esc(s.sourceLabel || s.label)} · ${esc(s.sourceRange || "")} · ${s.requiresHuman ? "接待指引，店规待确认" : "商家已确认答复"}` : "本店公开资料"} · V${s.version}</small></section>`).join("")}`);
			return;
		}
		if (a === "handoff") {
			showDialog("请民宿管家确认", `<p class="dialog-copy">将这条问题和相关空间信息交给本店管家。管家答复后，会显示在当前对话里。\n\n本原型仅生成本地待办，不会发送外部通知。</p><div class="dialog-actions">${btn("暂时不用", "close-dialog", "outline")}${btn("交给管家", "dialog-confirm", "")}</div>`, () => {
				if (mutate({
					type: "HANDOFF",
					threadId: b.dataset.thread,
					messageId: b.dataset.message
				}, "guest")) {
					render();
					toast("已交给管家，可切到商家端接手。");
				}
			});
			return;
		}
		if (a === "accept") {
			if (mutate({
				type: "ACCEPT",
				ticketId: b.dataset.ticket
			})) {
				render();
				toast("已接手，填写实际答复后发送。");
			}
			return;
		}
		if (a === "ticket-knowledge") {
			const t = state.tickets[b.dataset.ticket];
			knowledgeCache = {
				question: t.question,
				text: t.reply.body,
				aliases: []
			};
			go("merchant/knowledge-edit");
			return;
		}
		if (a === "save-draft") {
			const d = readEditor();
			editorCache = d;
			if (mutate({
				type: "SAVE_DRAFT",
				draft: d
			})) {
				editorCache = null;
				render();
				toast("草稿已保存，客人端尚未改变。");
			}
			return;
		}
		if (a === "publish-editor") {
			const d = readEditor();
			editorCache = d;
			showDialog("发布民宿资料", `<p class="dialog-copy">发布后，这家民宿的客人页面和AI新答复会使用当前表单资料，以及已经保存的问答草稿。\n\n历史对话保留原答复和当时依据。</p><div class="dialog-actions">${btn("再检查一下", "close-dialog", "outline")}${btn("确认发布", "dialog-confirm", "")}</div>`, () => {
				try {
					const published = dispatch(dispatch(state, {
						type: "SAVE_DRAFT",
						draft: d
					}, {
						role: "merchant",
						sessionId
					}), { type: "PUBLISH" }, {
						role: "merchant",
						sessionId
					});
					if (saveWorkspace(replaceProperty(workspace, activePropertyId, published))) {
						editorCache = null;
						render();
						toast("已发布 V" + state.published.version + "，新咨询会使用新资料。");
					}
				} catch (e) {
					toast("未发布：" + e.message + "，表单已保留。");
				}
			});
			return;
		}
		if (a === "new-knowledge") {
			knowledgeCache = {
				question: "",
				text: "",
				aliases: []
			};
			go("merchant/knowledge-edit");
			return;
		}
		if (a === "edit-knowledge") {
			knowledgeCache = structuredClone(state.draft.knowledge.find((k) => k.id === b.dataset.knowledge));
			go("merchant/knowledge-edit");
			return;
		}
		if (a === "delete-knowledge") {
			showDialog("从草稿中删除问答", `<p class="dialog-copy">删除后需要再次发布，才会从客人使用的资料中移除。历史对话不会被删除。</p><div class="dialog-actions">${btn("保留", "close-dialog", "outline")}${btn("删除草稿条目", "dialog-confirm", "")}</div>`, () => {
				if (mutate({
					type: "DELETE_KNOWLEDGE",
					knowledgeId: b.dataset.knowledge
				})) {
					render();
					toast("已从草稿中删除，发布后生效。");
				}
			});
			return;
		}
		if (a === "publish-knowledge") {
			showDialog("发布本店资料与问答", `<p class="dialog-copy">将发布所有已保存的民宿资料和问答草稿，新的提问使用公开版本 V${state.published.version + 1}。\n\n人工会话内容不会自动公开。</p><div class="dialog-actions">${btn("再检查一下", "close-dialog", "outline")}${btn("确认发布", "dialog-confirm", "")}</div>`, () => {
				if (mutate({ type: "PUBLISH" }, "merchant")) {
					render();
					toast("公开资料已更新至 V" + state.published.version);
				}
			});
			return;
		}
		if (a === "vr-settings") {
			showDialog("VR资料", `<p class="dialog-copy">当前素材类型：第三方参考案例\n\n${esc(state.draft.vrUrl)}\n\n来源：途家 / 如视\n\n此案例只演示全景体验，不与当前民宿房间、设施绑定。当前尚未提供本店真实VR素材。</p><a class="btn secondary wide" style="margin-top:20px" href="${esc(state.draft.vrUrl)}" target="_blank" rel="noopener noreferrer">查看指定VR参考 ${icon("external")}</a>`);
			return;
		}
		if (a === "visibility") {
			const v = !state.visible;
			showDialog(v ? "恢复房源展示" : "暂停房源展示", `<p class="dialog-copy">${v ? "恢复后，客人可以继续看房和发起咨询。" : "暂停后，客人不能查看房源资料或发起新的AI咨询；保留已有会话与人工回复。"}</p><div class="dialog-actions">${btn("取消", "close-dialog", "outline")}${btn("确认" + (v ? "恢复" : "暂停"), "dialog-confirm", "")}</div>`, () => {
				if (mutate({
					type: "SET_VISIBLE",
					visible: v
				})) {
					render();
					toast(v ? "已恢复展示" : "已暂停展示");
				}
			});
			return;
		}
		if (a === "export") {
			const blob = new Blob([JSON.stringify(workspace, null, 2)], { type: "application/json" }), url = URL.createObjectURL(blob), link = document.createElement("a");
			link.href = url;
			link.download = "松间小院-演示资料-" + Date.now() + ".json";
			link.click();
			setTimeout(() => URL.revokeObjectURL(url), 1e3);
			toast("已生成当前浏览器的演示数据备份。");
			return;
		}
		if (a === "reset") {
			showDialog("恢复初始示例", `<p class="dialog-copy">这会清除当前房源的演示咨询、人工回复和修改。其他房源与旧版原型数据不受影响。\n\n需要保留当前演示时，请先导出备份。</p><div class="dialog-actions">${btn("保留当前数据", "close-dialog", "outline")}${btn("确认恢复示例", "dialog-confirm", "")}</div>`, () => {
				try {
					const next = createWorkspace().properties[activePropertyId]?.state || createSeed();
					next.propertyId = state.propertyId;
					next.revision = state.revision + 1;
					if (!saveWorkspace(replaceProperty(workspace, activePropertyId, next))) return;
					composer = {
						body: "",
						context: null
					};
					editorCache = null;
					knowledgeCache = null;
					vrCache = null;
					replyCache = {};
					saveComposer();
					render();
					toast("已恢复初始示例。");
				} catch {
					toast("浏览器存储不可用，未清除当前数据。");
				}
			});
			return;
		}
	});
	document.addEventListener("input", (e) => {
		if (e.target.id === "life-chat-input") {
			lifeDraft = e.target.value;
			saveLifeDraft();
			const b = $("#life-chat-form .send-button");
			if (b) b.disabled = !lifeDraft.trim();
		}
		if (e.target.id === "chat-input") {
			composer.body = e.target.value;
			saveComposer();
			const send = $(".send-button");
			if (send) send.disabled = !composer.body.trim() || !state.visible || !sessionId;
		}
		if (e.target.closest("#property-form")) editorCache = readEditor();
		if (e.target.id === "reply-body") replyCache[parts()[2]] = e.target.value;
		if (e.target.closest("#vr-form")) {
			const f = new FormData($("#vr-form"));
			vrCache = {
				...structuredClone(state.draft),
				vrLabel: String(f.get("vrLabel")),
				vrDescription: String(f.get("vrDescription"))
			};
		}
		if (e.target.closest("#knowledge-form")) {
			const f = new FormData($("#knowledge-form"));
			knowledgeCache = {
				...knowledgeCache,
				question: String(f.get("question")),
				text: String(f.get("answer")),
				aliases: String(f.get("aliases")).split("\n").map((x) => x.trim()).filter(Boolean)
			};
		}
	});
	document.addEventListener("submit", (e) => {
		if (handleExtraSubmit(e)) return;
		if (e.target.id === "vr-form") {
			e.preventDefault();
			const f = new FormData(e.target);
			if (mutate({
				type: "SAVE_DRAFT",
				draft: {
					...structuredClone(state.draft),
					vrLabel: String(f.get("vrLabel")).trim(),
					vrDescription: String(f.get("vrDescription")).trim()
				}
			}, "merchant")) {
				vrCache = null;
				render();
				toast("VR资料草稿已保存，发布后影响客人端。");
			}
			return;
		}
		if (e.target.id === "chat-form") {
			e.preventDefault();
			const body = composer.body.trim();
			if (!body) return;
			if (mutate({
				type: "ASK",
				body,
				context: composer.context,
				operation: crypto.randomUUID()
			}, "guest")) {
				composer.body = "";
				saveComposer();
				render();
				$("#chat-input")?.focus({ preventScroll: true });
			}
			return;
		}
		if (e.target.id === "reply-form") {
			e.preventDefault();
			const ticketId = e.target.dataset.ticket, body = $("#reply-body").value;
			if (mutate({
				type: "REPLY",
				ticketId,
				body
			}, "merchant")) {
				delete replyCache[ticketId];
				render();
				toast("人工答复已回到客人原会话。");
			}
			return;
		}
		if (e.target.id === "knowledge-form") {
			e.preventDefault();
			const f = new FormData(e.target);
			if (mutate({
				type: "SAVE_KNOWLEDGE",
				knowledgeId: knowledgeCache?.id,
				...knowledgeCache?.kind === "confirmation_guide" ? { requiresHuman: f.has("still-needs-confirmation") } : {},
				question: String(f.get("question")),
				text: String(f.get("answer")),
				aliases: String(f.get("aliases")).split("\n").map((x) => x.trim()).filter(Boolean)
			}, "merchant")) {
				knowledgeCache = null;
				go("merchant/knowledge");
				toast("问答草稿已保存，发布后才参与AI回答。");
			}
		}
	});
	document.addEventListener("keydown", (e) => {
		if (e.target.id === "chat-input" && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
			e.preventDefault();
			$("#chat-form").requestSubmit();
		}
	});
	$("#detail-dialog").addEventListener("click", (e) => {
		if (e.target === $("#detail-dialog")) closeDialog();
	});
	$("#detail-dialog").addEventListener("cancel", () => {
		dialogAction = null;
	});
	window.addEventListener("hashchange", () => {
		if ($("#detail-dialog").open) closeDialog();
		render();
	});
	window.addEventListener("storage", (e) => {
		if (e.key === STORAGE && e.newValue) try {
			const next = JSON.parse(e.newValue);
			if (next.schema === 2 && next.revision !== workspace.revision) {
				workspace = next;
				setActive();
				render();
				toast("已同步另一窗口的房源与活动更新。");
			}
		} catch {
			toast("另一窗口资料格式异常，保留当前页面。");
		}
	});
	if (!location.hash) history.replaceState(null, "", location.pathname + location.search + "#/guest/home");
	render();
	//#endregion
})();
</script></body>
</html>
