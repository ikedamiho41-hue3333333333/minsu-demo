		}
		if (a === "publish-knowledge") {
			showDialog("发布本店资料与问答", `<p class="dialog-copy">将发布所有已保存的民宿资料和问答草稿，新的提问使用公开版本 V${state.published.version + 1}。\n\n人工会话内容不会自动公开。</p><div class="dialog-actions">${btn("再检查一下", "close-dialog", "outline")}${btn("确认发布", "dialog-confirm", "")}</div>`, () => {
				if (mutate({ type: "PUBLISH" }, "merchant")) {
					render();
					toast("公开资料已更新至 V" + state.published.version);
				}
			});
			return;
		}
		if (a === "vr-settings") {
			showDialog("VR资料", `<p class="dialog-copy">当前素材类型：第三方参考案例\n\n${esc(state.draft.vrUrl)}\n\n来源：途家 / 如视\n\n此案例只演示全景体验，不与当前民宿房间、设施绑定。当前尚未提供本店真实VR素材。</p><a class="btn secondary wide" style="margin-top:20px" href="${esc(state.draft.vrUrl)}" target="_blank" rel="noopener noreferrer">查看指定VR参考 ${icon("external")}</a>`);
			return;
		}
		if (a === "visibility") {
			const v = !state.visible;
			showDialog(v ? "恢复房源展示" : "暂停房源展示", `<p class="dialog-copy">${v ? "恢复后，客人可以继续看房和发起咨询。" : "暂停后，客人不能查看房源资料或发起新的AI咨询；保留已有会话与人工回复。"}</p><div class="dialog-actions">${btn("取消", "close-dialog", "outline")}${btn("确认" + (v ? "恢复" : "暂停"), "dialog-confirm", "")}</div>`, () => {
				if (mutate({
					type: "SET_VISIBLE",
					visible: v
				})) {
					render();
					toast(v ? "已恢复展示" : "已暂停展示");
				}
			});
			return;
		}
		if (a === "export") {
			const blob = new Blob([JSON.stringify(workspace, null, 2)], { type: "application/json" }), url = URL.createObjectURL(blob), link = document.createElement("a");
			link.href = url;
			link.download = "松间小院-演示资料-" + Date.now() + ".json";
			link.click();
			setTimeout(() => URL.revokeObjectURL(url), 1e3);
			toast("已生成当前浏览器的演示数据备份。");
			return;
		}
		if (a === "reset") {
			showDialog("恢复初始示例", `<p class="dialog-copy">这会清除当前房源的演示咨询、人工回复和修改。其他房源与旧版原型数据不受影响。\n\n需要保留当前演示时，请先导出备份。</p><div class="dialog-actions">${btn("保留当前数据", "close-dialog", "outline")}${btn("确认恢复示例", "dialog-confirm", "")}</div>`, () => {
				try {
					const next = createWorkspace().properties[activePropertyId]?.state || createSeed();
					next.propertyId = state.propertyId;
					next.revision = state.revision + 1;
					if (!saveWorkspace(replaceProperty(workspace, activePropertyId, next))) return;
					composer = {
						body: "",
						context: null
					};
					editorCache = null;
					knowledgeCache = null;
					vrCache = null;
					replyCache = {};
					saveComposer();
					render();
					toast("已恢复初始示例。");
				} catch {
					toast("浏览器存储不可用，未清除当前数据。");
				}
			});
			return;
		}
	});
	document.addEventListener("input", (e) => {
		if (e.target.id === "life-chat-input") {
			lifeDraft = e.target.value;
			try {
				sessionStorage.setItem("minsu-life-draft", lifeDraft);
			} catch {}
			const b = $("#life-chat-form .send-button");
			if (b) b.disabled = !lifeDraft.trim();
		}
		if (e.target.id === "chat-input") {
			composer.body = e.target.value;
			saveComposer();
			const send = $(".send-button");
			if (send) send.disabled = !composer.body.trim() || !state.visible || !sessionId;
		}
		if (e.target.closest("#property-form")) editorCache = readEditor();
		if (e.target.id === "reply-body") replyCache[parts()[2]] = e.target.value;
		if (e.target.closest("#vr-form")) {
			const f = new FormData($("#vr-form"));
			vrCache = {
				...structuredClone(state.draft),
				vrLabel: String(f.get("vrLabel")),
				vrDescription: String(f.get("vrDescription"))
			};
		}
		if (e.target.closest("#knowledge-form")) {
			const f = new FormData($("#knowledge-form"));
			knowledgeCache = {
				...knowledgeCache,
				question: String(f.get("question")),
				text: String(f.get("answer")),
				aliases: String(f.get("aliases")).split("\n").map((x) => x.trim()).filter(Boolean)
			};
		}
	});
	document.addEventListener("submit", (e) => {
		if (handleExtraSubmit(e)) return;
		if (e.target.id === "vr-form") {
			e.preventDefault();
			const f = new FormData(e.target);
			if (mutate({
				type: "SAVE_DRAFT",
				draft: {
					...structuredClone(state.draft),
					vrLabel: String(f.get("vrLabel")).trim(),
					vrDescription: String(f.get("vrDescription")).trim()
				}
			}, "merchant")) {
				vrCache = null;
				render();
				toast("VR资料草稿已保存，发布后影响客人端。");
			}
			return;
		}
		if (e.target.id === "chat-form") {
			e.preventDefault();
			const body = composer.body.trim();
			if (!body) return;
			if (mutate({
				type: "ASK",
				body,
				context: composer.context,
				operation: crypto.randomUUID()
			}, "guest")) {
				composer.body = "";
				saveComposer();
				render();
				$("#chat-input")?.focus({ preventScroll: true });
			}
			return;
		}
		if (e.target.id === "reply-form") {
			e.preventDefault();
			const ticketId = e.target.dataset.ticket, body = $("#reply-body").value;
			if (mutate({
				type: "REPLY",
				ticketId,
				body
			}, "merchant")) {
				delete replyCache[ticketId];
				render();
				toast("人工答复已回到客人原会话。");
			}
			return;
		}
		if (e.target.id === "knowledge-form") {
			e.preventDefault();
			const f = new FormData(e.target);
			if (mutate({
				type: "SAVE_KNOWLEDGE",
				knowledgeId: knowledgeCache?.id,
				...knowledgeCache?.kind === "confirmation_guide" ? { requiresHuman: f.has("still-needs-confirmation") } : {},
				question: String(f.get("question")),
				text: String(f.get("answer")),
				aliases: String(f.get("aliases")).split("\n").map((x) => x.trim()).filter(Boolean)
			}, "merchant")) {
				knowledgeCache = null;
				go("merchant/knowledge");
				toast("问答草稿已保存，发布后才参与AI回答。");
			}
		}
	});
	document.addEventListener("keydown", (e) => {
		if (e.target.id === "chat-input" && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
			e.preventDefault();
			$("#chat-form").requestSubmit();
		}
	});
	$("#detail-dialog").addEventListener("click", (e) => {
		if (e.target === $("#detail-dialog")) closeDialog();
	});
	$("#detail-dialog").addEventListener("cancel", () => {
		dialogAction = null;
	});
	window.addEventListener("hashchange", () => {
		if ($("#detail-dialog").open) closeDialog();
		render();
	});
	window.addEventListener("storage", (e) => {
		if (e.key === STORAGE && e.newValue) try {
			const next = JSON.parse(e.newValue);
			if (next.schema === 2 && next.revision !== workspace.revision) {
				workspace = next;
				setActive();
				render();
				toast("已同步另一窗口的房源与活动更新。");
			}
		} catch {
			toast("另一窗口资料格式异常，保留当前页面。");
		}
	});
	if (!location.hash) history.replaceState(null, "", location.pathname + location.search + "#/guest/home");
	render();
	//#endregion
})();
</script></body>
</html>
